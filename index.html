<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crochet Counter V2</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Confetti Layer -->
    <div id="confetti-container"></div>

    <div class="app">

        <!-- ======================
            SIDEBAR
        ======================= -->

        <aside class="sidebar">

            <div class="sidebar-header">
                <h1>🧶 Crochet Counter</h1>

                <button id="addProjectBtn">
                    + New Project
                </button>
            </div>

            <div id="projectList">
                <!-- Projects generated by JS -->
            </div>

        </aside>

        <!-- ======================
            MAIN CONTENT
        ======================= -->

        <main class="main-content">

            <!-- Current Project -->
            <div class="current-project">
                <h2 id="projectName">
                    Select Project
                </h2>
            </div>

            <!-- Current Section -->
            <div class="current-section">
                <h3 id="sectionName">
                    Select Section
                </h3>
            </div>

            <!-- Progress Ring -->
            <div class="progress-ring-container">
                <svg
                    class="progress-ring"
                    width="260"
                    height="260">

                    <circle
                        class="ring-background"
                        cx="130"
                        cy="130"
                        r="110">
                    </circle>

                    <circle
                        id="ringProgress"
                        class="ring-progress"
                        cx="130"
                        cy="130"
                        r="110">
                    </circle>
                </svg>

                <div class="counter-display">
                    <div id="currentCount">
                        0
                    </div>

                    <div class="slash">
                        /
                    </div>

                    <div id="targetCount">
                        0
                    </div>
                </div>
            </div>

            <!-- Percentage -->
            <div id="progressPercent">
                0%
            </div>

            <!-- Counter Buttons -->
            <div class="counter-buttons">
                <button id="minusBtn">
                    −
                </button>

                <button id="plusBtn">
                    +
                </button>
            </div>

            <!-- Section Actions -->
            <div class="section-actions">
                <button id="nextSectionBtn">
                    Next Section
                </button>

                <button id="addSectionBtn">
                    Add Section
                </button>
            </div>

            <!-- Instructions -->
            <div class="instructions-card">
                <div class="instructions-header">

                    <h3>
                        Instructions
                    </h3>

                    <button id="addInstructionBtn">
                        + Add Instruction
                    </button>
                </div>

                <ul id="instructionList">
                    <li>
                        No instructions yet.
                    </li>
                </ul>
            </div>

            <!-- Keyboard Help -->
            <div class="keyboard-shortcuts">
                ➡ Add Stitch
                •
                ⬅ Remove Stitch
                •
                Space Reset
                •
                Enter Next Section
            </div>
        </main>
    </div>

    <!-- ======================
        PROJECT MODAL
    ======================= -->

    <div
    class="modal hidden"
    id="projectModal">

    <div class="modal-content">

        <h2>
            Create Project
        </h2>

        <label>
            Project Name
        </label>

        <input
            id="projectNameInput"
            type="text"
            placeholder="Bee Project">

        <label>
            First Section
        </label>

        <input
            id="firstSectionInput"
            type="text"
            placeholder="Magic Ring">

        <label>
            Target Count
        </label>

        <input
            id="firstTargetInput"
            type="number"
            placeholder="6">

        <button
            id="createProjectBtn">
            Create Project
        </button>

    </div>
</div>

    <!-- ======================
        SECTION MODAL
    ======================= -->

    <div
        class="modal hidden"
        id="sectionModal">
        <div class="modal-content">
            <h2>
                New Section
            </h2>

            <input
                id="sectionNameInput"
                type="text"
                placeholder="Section Name">

            <input
                id="sectionTargetInput"
                type="number"
                placeholder="Target Count">

            <button id="createSectionBtn">
                Create Section
            </button>
        </div>
    </div>

    <!-- ======================
        NEXT SECTION MODAL
    ======================= -->

    <div
        class="modal hidden"
        id="nextSectionModal">
        <div class="modal-content">
            <h2>
                Create Next Section
            </h2>

            <input
                id="nextSectionNameInput"
                type="text"
                placeholder="Round 4">

            <input
                id="nextSectionTargetInput"
                type="number"
                placeholder="Target Count">

            <button id="confirmNextSectionBtn">
                Create
            </button>
        </div>
    </div>

    <!-- ======================
        INSTRUCTION MODAL
    ======================= -->

    <div
        class="modal hidden"
        id="instructionModal">
        <div class="modal-content">
            <h2>
                Add Instruction
            </h2>

            <textarea
                id="instructionInput"
                rows="4"
                placeholder="Example: (2 SC, INC) x6">
            </textarea>

            <button id="saveInstructionBtn">
                Save Instruction
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
